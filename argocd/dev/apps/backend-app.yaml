apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alumni-backend-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanishkpandey18/git-infra-repo.git'
    targetRevision: main
    path: charts/alumni-backend
    helm:
      valueFiles:
        - ../../argocd/dev/values/backend-dev.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: alumni-portal-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true