apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alumni-infra-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanishkpandey18/git-infra-repo.git'
    targetRevision: main
    path: charts/infra-services
    # Notice there is no helm block here, Argo CD just applies the raw YAMLs
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: alumni-portal-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true