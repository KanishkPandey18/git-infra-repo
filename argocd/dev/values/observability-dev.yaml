# ALIGNED DEV OBSERVABILITY OVERRIDES VALUE STREAM

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 2d
      # Crucial: Keeps custom monitors discoverable within your sandbox env
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      resources:
        requests:
          memory: 512Mi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: "local-path" 
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi # Reduced from 20Gi for lightweight Dev VM usage

  grafana:
    adminPassword: "admin"
    enabled: true
    service:
      type: LoadBalancer 
      annotations:
        metallb.universe.tf/address-pool: local-ip-pool
    persistence:
      enabled: true
      type: pvc
      storageClassName: "local-path"
      accessModes:
        - ReadWriteOnce
      size: 5Gi # Optimized for development footprint
      finalizers:
        - kubernetes.io/pvc-protection
        
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://alumni-observability-dev-loki:3100
      - name: Tempo
        type: tempo
        url: http://alumni-observability-dev-tempo:4317

# FIXED: Aligned structural naming key from 'loki' to 'loki-stack'
loki-stack:
  loki:
    config:
      retention_period: 48h
    persistence:
      enabled: true
      storageClassName: "local-path"
      size: 10Gi # Reduced from 10Gi for space saving

tempo:
  retention: 48h
  persistence:
    enabled: true
    storageClassName: "local-path"
    size: 10Gi # Reduced from 10Gi for space saving
