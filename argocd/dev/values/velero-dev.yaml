velero:
  deployNodeAgent: true
  upgradeCRDs: false
  configuration:
    backupStorageLocation:
      - name: default
        provider: aws
        bucket: dev-cluster-backups
        config:
          region: minio
          s3ForcePathStyle: true
          s3Url: "http://192.168.41.37:32000"
    volumeSnapshotLocation:
      - name: default
        provider: aws
          
  # The fix to stop it from guessing v1.34
  kubectl:
    image:
      repository: docker.io/bitnami/kubectl
      tag: "1.30.0"
