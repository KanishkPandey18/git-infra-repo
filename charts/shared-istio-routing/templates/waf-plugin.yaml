{{- $enabled := false }}
{{- if kindIs "string" .Values.wafEnabled }}
  {{- if eq .Values.wafEnabled "true" }}
    {{- $enabled = true }}
  {{- end }}
{{- else if kindIs "bool" .Values.wafEnabled }}
  {{- $enabled = .Values.wafEnabled }}
{{- end }}

{{- if $enabled }}
apiVersion: extensions.istio.io/v1alpha1
kind: WasmPlugin
metadata:
  name: coraza-waf-{{ .Release.Namespace }}
  namespace: istio-system
  labels:
    app: coraza-waf
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  url: oci://ghcr.io/corazawaf/coraza-proxy-wasm:latest
  imagePullPolicy: IfNotPresent
  phase: AUTHN
  pluginConfig:
    directives_map:
      default:
        # 1. Engine Core States Setup
        - "SecRuleEngine On"
        - "SecRequestBodyAccess On"
        - "SecResponseBodyAccess Off" # Protects your bare-metal ProLiant nodes from OOM loops
        - "SecDebugLogLevel 0"
        
        # 2. Robust SQL Injection Defenses (Catches variations like '---, #, and comment breaks)
        - "SecRule ARGS \"(?i)(['\"\\x00\\n\\r\\x1a]|\\b(select|union|insert|update|delete|drop|alter|where|from|grant)\\b|--|#|\\/\\*)\" \"id:920100,phase:2,deny,status:403,msg:'Advanced SQLi Attempt Blocked'\""
        - "SecRule ARGS \"(?i)\\bhas_key\\b|\\bor\\b\\s+(\\d+|'[^']+')\\s*=\\s*(\\d+|'[^']+')|\\bunion\\b\\s+select\" \"id:1005,phase:2,deny,status:403,msg:'SQL Tautology Blocked'\""
        
        # 3. Comprehensive Cross-Site Scripting (XSS) Defenses (Catches JavaScript URIs and Event Handlers)
        - "SecRule ARGS \"(?i)(<script|javascript:|onerror=|onload=|alert\\(|src=x)\" \"id:941100,phase:2,deny,status:403,msg:'Advanced XSS Attempt Blocked'\""
        
        # 4. Path Traversal & Local File Inclusion (LFI) Defenses (Catches ../ and system file names)
        - "SecRule ARGS \"(?i)(\\.\\.\\/|\\.\\.\\\\|etc\\/passwd|config\\.env|boot\\.ini|win\\.ini)\" \"id:930100,phase:2,deny,status:403,msg:'Path Traversal / LFI Attempt Blocked'\""
        
        # 5. Generic Scanner Blocker (Header Rule)
        - "SecRule REQUEST_HEADERS:User-Agent \"(?i)(sqlmap|nikto|dirbuster|gobuster|w3af|acunetix)\" \"id:1004,phase:1,deny,status:403,msg:'Malicious Scanner Blocked'\""
    default_directives: "default"
{{- end }}