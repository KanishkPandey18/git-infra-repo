apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: alumni-global-router
  namespace: {{ .Release.Namespace }}
spec:
  hosts:
  - "*"
  gateways:
  - alumni-shared-gateway
  http:
    - match:
      - uri:
          prefix: /api
      route:
      - destination:
          host: alumni-backend-service.{{ .Release.Namespace }}.svc.cluster.local
          port:
            number: 8000
    - match:
      - uri:
          prefix: /auth
      route:
      - destination:
          host: keycloak-service.{{ .Release.Namespace }}.svc.cluster.local
          port:
            number: 8080
        headers:
          request:
            set:
              x-forwarded-proto: "https"
              x-forwarded-port: "443"
    - match:
      - uri:
          prefix: /
      route:
      - destination:
          host: alumni-frontend-service.{{ .Release.Namespace }}.svc.cluster.local
          port:
            number: 80