apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: alumni-shared-gateway
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
    tls:
      httpsRedirect: true # Automatically force HTTP to HTTPS
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: alumni-tls # Must match the secret name in Step 2
    hosts:
    - "*"
