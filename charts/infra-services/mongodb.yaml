apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: alumni-portal-dev
spec:
  serviceName: "mongo-service"
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:6.0
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom: { secretKeyRef: { name: alumni-secrets, key: MONGO_INITDB_ROOT_USERNAME } }
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: alumni-secrets, key: MONGO_INITDB_ROOT_PASSWORD } }
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongo-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "local-path"
      resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: alumni-portal-dev
spec:
  ports: [{ port: 27017, targetPort: 27017 }]
  selector: { app: mongodb }
