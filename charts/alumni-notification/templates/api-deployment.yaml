apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: notification-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-api
  template:
    metadata:
      labels:
        app: notification-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "api/index.js"]
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            # --- Dynamic Cluster Routing URL ---
            - name: KAFKA_BROKER
              value: "kafka.{{ .Release.Namespace }}.svc.cluster.local:9092"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi