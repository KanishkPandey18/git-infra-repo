apiVersion: v1
kind: Service
metadata:
  name: alumni-notification-api-service
  labels:
    app: notification-api
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http-rpc
  selector:
    app: notification-api