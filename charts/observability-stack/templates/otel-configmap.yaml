apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
        
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
      zipkin:
        endpoint: 0.0.0.0:9411
          
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch:
        send_batch_size: 1024
        timeout: 1s
        
      batch:
        send_batch_size: 1024
        timeout: 1s
        
    exporters:
      tempo:
        endpoint: "alumni-observability-dev-tempo.observability.svc.cluster.local:4317"
        tls:
          insecure: true
        
    service:
      pipelines:
        traces:
          receivers: [otlp]        #add zipkin here if you want to receive traces from zipkin as well
          processors: [memory_limiter, batch]
          exporters: [tempo]
