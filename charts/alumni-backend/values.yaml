image:
  repository: avitheg/alumni-frontend
  pullPolicy: Always
  tag: "v2"

service:
  port: 8000
  targetPort: 8000

env:
  # Keep your static environment configurations here
  NODE_ENV: "production"
  KEYCLOAK_REALM: "application"
  KEYCLOAK_CLIENT_ID: "backend-client"
  KEYCLOAK_ISSUER: "https://192.168.41.88/auth/realms/application"
  secretName: "alumni-secrets"
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin"
