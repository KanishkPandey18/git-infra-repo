apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: alumni-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alumni-backend
  template:
    metadata:
      labels:
        app: alumni-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            
            # --- 1. The Security Fix: Securely pulling the DB password ---
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.secretName }}
                  key: MONGO_URI
                  
            # --- 2. The Architectural Fix: Dynamic cluster routing ---
            - name: KEYCLOAK_JWKS_URI
              value: {{ .Values.env.KEYCLOAK_JWKS_URI | quote }}
            - name: NOTIFICATION_SERVICE_URL
              value: {{ .Values.env.NOTIFICATION_SERVICE_URL | quote }}
            - name: KEYCLOAK_SERVER_URL
              value: {{ .Values.env.KEYCLOAK_INTERNAL_URL | quote }}
            
            # --- Standard Keycloak Configurations ---
            - name: KEYCLOAK_ISSUER
              value: {{ .Values.env.KEYCLOAK_ISSUER | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.env.KEYCLOAK_REALM | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.env.KEYCLOAK_CLIENT_ID | quote }}

            # --- OBSERVABILITY TELEMETRY INJECTION (gRPC FLOW ON PORT 4317) ---
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector.observability.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "alumni-backend"
              
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 512Mi
